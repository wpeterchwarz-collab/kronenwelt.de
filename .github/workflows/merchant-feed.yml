name: Google-Produktdatei und Unterseiten aktualisieren

# Erzeugt neu, sobald sich Katalog, Fotos oder Seitentexte ändern
# (z.B. wenn Sara im Admin Preise anpasst):
#   - merchant-feed.xml (Produktdatei für Google)
#   - die Unterseiten, die Produktkarten in index.html und sitemap.xml (scripts/seiten.js)
on:
  push:
    branches: [main]
    paths:
      - katalog.json
      - medien.json
      - seiten.json
      - index.html
      - vorlagen/**
      - scripts/merchant-feed.js
      - scripts/seiten.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/merchant-feed.js
      - run: node scripts/seiten.js
      - name: Änderungen committen
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Alles unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Produktdatei und Unterseiten aus katalog.json aktualisiert"
          git push
